server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Serve the OIDC callback without logging authorization response parameters.
  location = /auth/callback {
    access_log off;
    try_files /index.html =404;
  }
  # Machine TLS terminates only at the dedicated API connector.
  location = /api/machine { return 403; }
  location ^~ /api/machine/ { return 403; }
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
